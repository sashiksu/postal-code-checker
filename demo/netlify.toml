# Netlify config for the postal-code-checker demo.
# Build runs from repo root so it can see the library source via the Vite alias.

[build]
  base = "demo"
  publish = "demo/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — any unknown path serves index.html so client-side anchors work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
